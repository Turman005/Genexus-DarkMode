# Xpz.Dark - dark mode do IDE do GeneXus. EXPERIMENTO, so na U10.
#
# Este arquivo E o interruptor: apague-o e a extensao nao faz nada.
# Editar NAO precisa de admin nem de recompilar - so reabrir o GeneXus.
# O que aconteceu em cada subida fica em dark.log, nesta mesma pasta.
#
# ------------------------------------------------------------------ FASE 1
#
# Tabela de cor GLOBAL do Infragistics. O docking do GeneXus usa o estilo
# Office2007, que tira as cores daqui. Valores: Blue, Black, Silver
# (o 2010 aceita os mesmos). Comente com # para nao mexer.
Office2007ColorScheme = Black
Office2010ColorScheme = Black

# Inverter a luminosidade dos icones de moldura com traco escuro:
# alfinete, fechar, setas de rolagem e a lista de abas. sim / nao
ClarearIconesMoldura = sim

# Diagnostico: 10s apos a subida, pergunta aos objetos vivos do Infragistics
# qual estilo usam e quais aparencias o GeneXus preencheu, e grava em
# dark-diagnostico.log. Ausente = ligado. sim / nao
Diagnostico = nao

# Carregar tambem o .isl escuro do experimento de agosto. sim / nao
# Ele escurecia so as barras dentro dos paineis. Bom para comparar:
# rode uma vez com sim e outra com nao.
CarregarIsl = sim

# ------------------------------------------------------------------ FASE 2
# Controles comuns do Windows (PropertyGrid, caixas de texto, combos, listas,
# arvores, menus WinForms, dialogos). So troca cor PADRAO/neutra; cor que o
# GeneXus pos de proposito (vermelho de erro, azul de link) fica.
# Chave ausente = ligado.
Fase2 = sim

# Botoes viram planos (com o visual do Windows eles ignoram cor de fundo).
Botoes = sim

# Combos viram planos, pelo mesmo motivo.
CombosPlanos = sim

# Barra de titulo escura nas janelas (Windows 10 2004+ / 11).
TituloEscuro = sim

# Barras de rolagem escuras em arvores, listas e caixas de texto.
BarrasRolagemEscuras = sim

# Menus e faixas de ferramentas WinForms, inclusive menus de contexto.
ToolStripsEscuros = sim

# Censo: 12s apos a subida, grava em dark-censo.log que controles existem em
# cada janela e de que familia - para achar o que ainda fica claro.
Censo = nao

# Escurecer so a MOLDURA em volta do Web Layout. Os controles da tela desenhada
# (labels, campos, grids) ficam sempre como o GeneXus desenha.
FundoWebLayout = sim

# Output (editor Monaco) escuro, e Start Page/Launchpad escuros (pagina web invertida).
OutputEscuro = sim
PaginasWebEscuras = sim

# ------------------------------------------------------------------ FASE 3
# Editor de codigo (Source, Rules, Events...): fundo escuro e cores da sintaxe
# clareadas mantendo o tom, ate o contraste minimo (4.5 normal, 7 alto).
EditorEscuro = sim
EditorAjustarSintaxe = sim
EditorContraste = 4.5

# ------------------------------------------------------------------ CORES
# Mais facil pela tela: menu Tema Escuro > Configuracoes do tema...
# Ativo = nao desliga tudo sem desinstalar.
Ativo = sim
# ardosia, grafite, meianoite, ametista, brasa, ambar, oliva ou Personalizado (usa as Cor*)
Tema = ardosia
CorFundoCodigo = 30, 30, 30
CorFundoEntrada = 30, 30, 30
CorFundoPainel = 37, 37, 38
CorTexto = 222, 222, 222
CorSelecao = 38, 79, 120
CorLink = 86, 156, 214

# Varredura do que ainda esta claro (dark-auditoria.log) e menus nativos escuros.
Auditoria = nao
MenusNativosEscuros = sim

# Escurece cada janela nova antes de ela aparecer (sem piscar branco).
EscurecerAntesDeMostrar = sim
